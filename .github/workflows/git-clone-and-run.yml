name: Git clone and run
run-name: Git clone and run

# PRs trigger via `pull_request`; `push` is scoped to main so a same-repo PR branch
# doesn't run this twice (once for the push, once for the PR).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run on the same ref instead of letting stale runs pile up.
concurrency:
  group: git-clone-and-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-git-clone-and-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']  # the supported range (pyproject requires-python)
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Lint with ruff
        run: pip install ruff && ruff check .
      - name: install ffmpeg, espeak-ng
        run: sudo apt-get update && sudo apt-get install ffmpeg espeak-ng --fix-missing
      - name: Install dependencies
        run: pip install .
      - name: Dependency check (deptry)
        # Advisory for now (the box this was authored on couldn't verify it green); promote to a
        # hard gate once confirmed passing in CI.
        continue-on-error: true
        run: pip install deptry && deptry .
      - name: check it runs as script
        run: audiblez --help
      # Real EPUB -> M4B end-to-end smoke, on ONE python version to bound cost. Uses the in-repo
      # fixture (no external download to break) and only the first chapter (still emits an m4b).
      - name: create audiobook (in-repo fixture, first chapter)
        if: matrix.python-version == '3.11'
        run: audiblez test/poe.epub --chapters 1 -o test/e2e_out
      - name: check m4b output file
        if: matrix.python-version == '3.11'
        run: ls -lah test/e2e_out/*.m4b
      - name: run hermetic unit tests
        shell: bash
        run: |
          set -e
          # Auto-discover every hermetic test file (no hand-maintained list to drift out of sync);
          # fail loudly if none are found. test_main is the network/integration test (downloads a
          # whole book) — it's covered by the e2e step above, so it's excluded from the fast loop.
          count=0
          for f in test/test_*.py; do
            name=$(basename "$f")
            if [ "$name" = "test_main.py" ]; then
              echo "Skipping integration test $name (covered by the e2e step)"
              continue
            fi
            echo "::group::$name"
            python -m unittest discover -s test -p "$name" -v
            echo "::endgroup::"
            count=$((count + 1))
          done
          [ "$count" -gt 0 ] || { echo "ERROR: no hermetic test files found under test/"; exit 1; }
          echo "Ran $count hermetic test files."

  windows-git-clone-and-run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install .
      - name: check it runs as script
        run: audiblez --help
      - name: run hermetic unit tests
        # pytest is NOT a dependency of this project — the previous `python -m pytest` here failed
        # with ModuleNotFoundError. Use unittest, the same auto-discover loop as Linux (bash is
        # available on the windows runner via Git Bash).
        shell: bash
        run: |
          set -e
          count=0
          for f in test/test_*.py; do
            name=$(basename "$f")
            if [ "$name" = "test_main.py" ]; then
              echo "Skipping integration test $name"
              continue
            fi
            python -m unittest discover -s test -p "$name" -v
            count=$((count + 1))
          done
          [ "$count" -gt 0 ] || { echo "ERROR: no hermetic test files found under test/"; exit 1; }
